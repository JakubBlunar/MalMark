name: Checks and release

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:firefox
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package browser extensions
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: malmark-extensions
          path: |
            artifacts/malmark-chromium.zip
            artifacts/malmark-firefox.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download checked browser packages
        run: gh run download "$GITHUB_RUN_ID" --name malmark-extensions --dir artifacts
      - name: Publish both browser packages
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/malmark-chromium.zip artifacts/malmark-firefox.zip --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/malmark-chromium.zip artifacts/malmark-firefox.zip --verify-tag --generate-notes --title "Malmark $RELEASE_TAG"
          fi
